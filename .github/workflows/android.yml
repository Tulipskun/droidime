name: Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droidime-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Replace the single latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete latest --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          fi
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DroidIME latest" \
            --notes "Latest installable DroidIME APK. This release is replaced on every successful main build."
