name: Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droidime-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Every run gets a higher versionCode, so the in-app update check always sees new builds.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
          key: android-ndk-27.3.13750724
      - name: Install Android NDK
        run: sdkmanager "ndk;27.3.13750724"
      - name: Resolve cloudflared revision
        id: cloudflared
        run: |
          set -euo pipefail
          ref="$(git ls-remote https://github.com/cloudflare/cloudflared.git HEAD | cut -f1)"
          test "${#ref}" -eq 40
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Cache cloudflared binaries
        id: cloudflared-binaries
        uses: actions/cache@v4
        with:
          path: app/src/main/jniLibs
          key: cloudflared-binaries-${{ steps.cloudflared.outputs.ref }}-ndk27.3-go1.26-16k
      - name: Cache cloudflared source
        uses: actions/cache@v4
        with:
          path: /tmp/cloudflared
          key: cloudflared-source-${{ steps.cloudflared.outputs.ref }}
      - name: Cache cloudflared Go dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: cloudflared-go-${{ steps.cloudflared.outputs.ref }}-go1.26
      - name: Build cloudflared Android binaries
        if: steps.cloudflared-binaries.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.3.13750724
        run: |
          set -euxo pipefail
          if [ ! -f /tmp/cloudflared/go.mod ]; then
            rm -rf /tmp/cloudflared
            git clone --depth 1 https://github.com/cloudflare/cloudflared.git /tmp/cloudflared
          fi
          cd /tmp/cloudflared
          export TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a" "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64"
          export CGO_ENABLED=1 GOOS=android
          export GOARCH=arm64 CC="$TOOLCHAIN/bin/aarch64-linux-android21-clang"
          go build -trimpath -ldflags="-linkmode=external -extldflags=-Wl,-z,max-page-size=16384" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libcloudflared.so" ./cmd/cloudflared
          export GOARCH=arm GOARM=7 CC="$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang"
          go build -trimpath -ldflags="-linkmode=external -extldflags=-Wl,-z,max-page-size=16384" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libcloudflared.so" ./cmd/cloudflared
          export GOARCH=amd64 CC="$TOOLCHAIN/bin/x86_64-linux-android21-clang"
          unset GOARM
          go build -trimpath -ldflags="-linkmode=external -extldflags=-Wl,-z,max-page-size=16384" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86_64/libcloudflared.so" ./cmd/cloudflared
          file "$GITHUB_WORKSPACE"/app/src/main/jniLibs/*/libcloudflared.so
          chmod 755 "$GITHUB_WORKSPACE"/app/src/main/jniLibs/*/libcloudflared.so
          for lib in "$GITHUB_WORKSPACE"/app/src/main/jniLibs/*/libcloudflared.so; do
            readelf -lW "$lib" | awk '$1=="LOAD"{print $NF}' | grep -qx "0x4000"
          done
      - name: Verify bundled cloudflared
        run: |
          set -euxo pipefail
          test -f app/src/main/jniLibs/arm64-v8a/libcloudflared.so
          test -f app/src/main/jniLibs/armeabi-v7a/libcloudflared.so
          test -f app/src/main/jniLibs/x86_64/libcloudflared.so
          test "$(find app/src/main/jniLibs -name libcloudflared.so | wc -l)" -eq 3
      - name: Test Cloudflare MCP gateway
        run: npm --prefix gateway test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Check out private signing key
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: Tulipskun/droidime-key
          ssh-key: ${{ secrets.DROIDIME_KEY_SSH_KEY }}
          path: .signing-key
          persist-credentials: false
      - name: Prepare signing key
        if: github.event_name != 'pull_request'
        run: |
          test -s .signing-key/release.keystore
          install -m 600 .signing-key/release.keystore app/release.keystore
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload keyboard render previews
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-render-${{ github.run_number }}
          path: app/build/render/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gradle --no-daemon assembleDebug
          else
            test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
            test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
            test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
            gradle --no-daemon assembleRelease
          fi
      - name: Replace the single latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk DroidIME.apk
          if gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete latest --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          fi
          gh release create latest DroidIME.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DroidIME ${VERSION_NAME}" \
            --notes "DroidIME ${VERSION_NAME} (versionCode=${VERSION_CODE})"
          rm -f DroidIME.apk
      - name: Remove signing key
        if: always() && github.event_name != 'pull_request'
        run: |
          rm -f app/release.keystore .signing-key/release.keystore
