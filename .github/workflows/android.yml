name: Android Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: droidime-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Prepare signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "HAS_RELEASE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_KEY=false" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "$HAS_RELEASE_KEY" != "true" ]; then
            gradle --no-daemon assembleDebug
          else
            test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
            test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
            test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
            gradle --no-daemon assembleRelease
          fi
      - name: Replace the single latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk DroidIME.apk
            rm -f app/release.keystore
            if gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release delete latest --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
            fi
            gh release create latest DroidIME.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --title "DroidIME latest" \
              --notes "versionCode=${GITHUB_RUN_NUMBER}"
            rm -f DroidIME.apk
          else
            echo "Release skipped: configure the four ANDROID_KEYSTORE_* GitHub Actions secrets."
          fi
